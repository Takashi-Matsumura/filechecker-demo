name: CI

on:
  pull_request:
  push:
    branches: [main]

# 読み取りだけで足りる（コメントやリリースは行わない）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: 本番ビルド
        run: npm run build
